<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Walton AC Remote</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e2e8f0;
            --remote-bg: #f8fafc;
            --btn-bg: #f1f5f9;
            --btn-shadow: -3px -3px 7px #ffffff, 3px 3px 7px #cbd5e1;
            --btn-shadow-active: inset -3px -3px 7px #ffffff, inset 3px 3px 7px #cbd5e1;
            --text-dark: #334155;
            --walton-blue: #0284c7;
            --power-red: #ef4444;
            --screen-bg: #e0f2fe;
            --unlearned: #94a3b8;
            --learning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .remote {
            background-color: var(--remote-bg);
            width: 100%;
            max-width: 340px;
            border-radius: 40px;
            padding: 30px 20px;
            box-shadow: -10px -10px 20px #ffffff, 10px 10px 20px #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
        }

        .screen {
            background-color: var(--screen-bg);
            height: 120px;
            border-radius: 12px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1), inset -2px -2px 5px rgba(255,255,255,0.7);
            border: 2px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #0f172a;
            font-family: monospace;
        }
        
        .temp-display {
            font-size: 32px;
            font-weight: 700;
        }

        .btn {
            background-color: var(--btn-bg);
            border: none;
            box-shadow: var(--btn-shadow);
            color: var(--text-dark);
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            position: relative;
        }
        
        .btn:active {
            box-shadow: var(--btn-shadow-active);
            color: var(--walton-blue);
        }

        .btn.unlearned {
            color: var(--unlearned);
            border: 1px dashed #cbd5e1;
            box-shadow: none;
        }
        
        .btn.is-learning {
            border: 2px solid var(--learning);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .btn-round { width: 50px; height: 50px; border-radius: 50%; }
        .btn-power { color: var(--power-red); font-size: 20px; }
        .btn-power.unlearned { color: #fca5a5; }
        .btn-pill { height: 40px; padding: 0 20px; border-radius: 20px; }

        .d-pad-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 10px auto;
            border-radius: 50%;
            background-color: var(--remote-bg);
            box-shadow: var(--btn-shadow);
            padding: 10px;
        }

        .d-pad {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
        }

        .d-btn {
            position: absolute;
            background-color: var(--btn-bg);
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            color: var(--text-dark);
            transition: all 0.1s;
        }
        
        .d-btn:active { background-color: #e2e8f0; }
        .d-btn.unlearned { color: var(--unlearned); background-color: #f8fafc; }
        .d-btn.is-learning { background-color: #fef3c7; }

        .d-top { top: 0; left: 0; right: 0; height: 50%; clip-path: polygon(0 0, 100% 0, 75% 50%, 25% 50%); padding-bottom: 25px;}
        .d-bottom { bottom: 0; left: 0; right: 0; height: 50%; clip-path: polygon(25% 50%, 75% 50%, 100% 100%, 0 100%); padding-top: 25px;}
        .d-left { top: 0; bottom: 0; left: 0; width: 50%; clip-path: polygon(0 0, 50% 25%, 50% 75%, 0 100%); padding-right: 25px;}
        .d-right { top: 0; bottom: 0; right: 0; width: 50%; clip-path: polygon(50% 25%, 100% 0, 100% 100%, 50% 75%); padding-left: 25px;}

        .d-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-size: 13px;
        }

        .bottom-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px 15px;
            padding: 10px;
            justify-items: center;
        }

        .btn-small { width: 55px; height: 55px; border-radius: 50%; font-size: 10px; }
        .icon { font-size: 20px; }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .branding {
            color: var(--walton-blue);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .learn-toggle {
            font-size: 12px;
            background: #e2e8f0;
            padding: 5px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
        }
        .learn-toggle.active {
            background: var(--learning);
            color: white;
        }

        .toast {
            position: fixed;
            top: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }
        
        .nav-back {
            position: absolute;
            top: -40px;
            left: 0;
            color: var(--walton-blue);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">Command Sent</div>

    <div class="remote">
        <a href="/" class="nav-back">← Back to Remotes</a>
        
        <div class="screen" id="lcd">
            <div class="temp-display" id="temp-val">AC Ready</div>
            <div style="font-size: 12px; color: #64748b; margin-top: 5px;" id="mode-val">Standard Mode</div>
        </div>

        <div class="top-row">
            <button class="btn btn-round btn-power" id="btn-PWR" onclick="handlePress('PWR')" title="Power">⏻</button>
            <button class="btn btn-pill" id="btn-HEALTH" onclick="handlePress('HEALTH')">HEALTH</button>
            <button class="btn btn-round" id="btn-ECO" onclick="handlePress('ECO')">ECO</button>
        </div>

        <div class="d-pad-container">
            <div class="d-pad">
                <div class="d-btn d-top" id="btn-TEMP_UP" onclick="handlePress('TEMP_UP')">+</div>
                <div class="d-btn d-bottom" id="btn-TEMP_DOWN" onclick="handlePress('TEMP_DOWN')">-</div>
                <div class="d-btn d-left" id="btn-SWING_H" onclick="handlePress('SWING_H')" title="Horizontal Swing">≡</div>
                <div class="d-btn d-right" id="btn-SWING_V" onclick="handlePress('SWING_V')" title="Vertical Swing">|||</div>
            </div>
            <button class="btn d-center" id="btn-MODE" onclick="handlePress('MODE')">MODE</button>
        </div>

        <div class="bottom-grid">
            <button class="btn btn-small" id="btn-TURBO" onclick="handlePress('TURBO')">TURBO</button>
            <button class="btn btn-small" id="btn-FAN" onclick="handlePress('FAN')">FAN</button>
            <button class="btn btn-small" id="btn-SLEEP" onclick="handlePress('SLEEP')">SLEEP</button>
            
            <button class="btn btn-small" id="btn-SETTINGS" onclick="handlePress('SETTINGS')"><span class="icon">⚙️</span></button>
            <button class="btn btn-small" id="btn-TIMER" onclick="handlePress('TIMER')">TIMER</button>
            <button class="btn btn-small" id="btn-DISPLAY" onclick="handlePress('DISPLAY')">DISPLAY</button>
        </div>

        <div class="footer">
            <div class="branding">WALTON</div>
            <div class="learn-toggle" id="learn-toggle" onclick="toggleLearnMode()">Learn Mode: OFF</div>
        </div>
    </div>

    <script>
        const REMOTE_ID = "walton_ac_custom";
        const REMOTE_NAME = "Walton AC";
        let allRemotes = [];
        let remoteData = null;
        let isLearningMode = false;
        let isWaitingForIR = false;

        async function init() {
            try {
                const res = await fetch('/api/remotes');
                if (res.ok) {
                    allRemotes = await res.json();
                    remoteData = allRemotes.find(r => r.id === REMOTE_ID);
                    
                    // Create if it doesn't exist
                    if (!remoteData) {
                        remoteData = { id: REMOTE_ID, name: REMOTE_NAME, type: 'ac', buttons: [] };
                        allRemotes.push(remoteData);
                        await saveToServer();
                    }
                    updateButtonUI();
                }
            } catch (e) {
                console.error("Failed to fetch remotes", e);
                showToast("Offline Mode (No ESP Connection)");
            }
        }

        async function saveToServer() {
            try {
                await fetch('/api/remotes', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(allRemotes)
                });
            } catch (e) { console.error(e); }
        }

        function updateButtonUI() {
            if (!remoteData) return;
            const buttons = ['PWR', 'HEALTH', 'ECO', 'TEMP_UP', 'TEMP_DOWN', 'SWING_H', 'SWING_V', 'MODE', 'TURBO', 'FAN', 'SLEEP', 'SETTINGS', 'TIMER', 'DISPLAY'];
            
            buttons.forEach(btnId => {
                const el = document.getElementById(`btn-${btnId}`);
                if (!el) return;
                
                const btnData = remoteData.buttons.find(b => b.id === btnId);
                el.classList.remove('unlearned', 'is-learning');
                
                if (!btnData || !btnData.learned) {
                    el.classList.add('unlearned');
                }
            });
        }

        function toggleLearnMode() {
            if (isWaitingForIR) return; // Don't allow toggle while waiting
            isLearningMode = !isLearningMode;
            const toggle = document.getElementById('learn-toggle');
            toggle.innerText = `Learn Mode: ${isLearningMode ? 'ON' : 'OFF'}`;
            toggle.classList.toggle('active', isLearningMode);
            
            if (isLearningMode) {
                showToast("Tap any dashed button to learn it");
            }
        }

        async function handlePress(btnId) {
            if (!remoteData || isWaitingForIR) return;
            
            // Ensure button exists in our JSON
            let btnData = remoteData.buttons.find(b => b.id === btnId);
            if (!btnData) {
                btnData = { id: btnId, name: btnId, learned: false };
                remoteData.buttons.push(btnData);
                await saveToServer();
            }

            const el = document.getElementById(`btn-${btnId}`);

            if (isLearningMode) {
                // Enter learning state
                isWaitingForIR = true;
                el.classList.add('is-learning');
                document.getElementById('temp-val').innerText = "WAIT";
                document.getElementById('mode-val').innerText = "Point remote & press...";
                
                try {
                    const res = await fetch(`/api/learn?remote=${REMOTE_ID}&button=${btnId}`);
                    if (res.ok) {
                        showToast(`Learned successfully!`);
                        await init(); // Reload data to get IR codes
                    } else {
                        showToast(`Timeout or failed.`);
                    }
                } catch(e) { 
                    showToast("ESP Connection Error"); 
                }
                
                isWaitingForIR = false;
                el.classList.remove('is-learning');
                document.getElementById('temp-val').innerText = "AC Ready";
                document.getElementById('mode-val').innerText = "Standard Mode";
                updateButtonUI();

            } else {
                // Sending state
                if (!btnData.learned) {
                    showToast("Button not learned yet!");
                    return;
                }
                
                document.getElementById('temp-val').innerText = btnId;
                document.getElementById('mode-val').innerText = "Sending...";
                
                try {
                    await fetch(`/api/send?remote=${REMOTE_ID}&button=${btnId}`);
                    showToast("Sent!");
                } catch(e) { 
                    showToast("Failed to send"); 
                }
                
                setTimeout(() => {
                    document.getElementById('temp-val').innerText = "AC Ready";
                    document.getElementById('mode-val').innerText = "Standard Mode";
                }, 1000);
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
